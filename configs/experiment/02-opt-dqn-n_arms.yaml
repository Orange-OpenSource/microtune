# @package _global_
defaults:
  - _base
  - _sweep_optuna
  - override /datasets: traintest-full
  - override /tuner: dqn
  - override /tuner/actions: lesstenplusten      # The Min and Max action values. Here we have 21 arms: -10 up to -1, 0 and then 1 up to 10
  - override /tuner/reward: optimal_policy_distance # In paper: sigmoidhybriddiscretmoveidelta
  - _self_

info: Hyper params & ALPHA,BETA optim with Optuna + rew=optimal_policy_distance FIXED with Arm's factor + Arms (-10,+10)

datasets_prefix: workloads_legacy

n_seeds: 4
n_jobs: 2 # Number of parallel trainings with different seed
n_trials: 20
hydra_launcher_n_jobs: 2 # Number of trials in parallel with Optuna

REW_ALPHA_COEF: 0.185 
REW_BETA_COEF: 0.7
REW_ARMS_STRENGTH_OPTION: False # Should be True with the Sigmoid Reward and False with the Optima Distance to the policy reward

# learning_rate=0.0001, buffer_size=1000000, learning_starts=100, batch_size=32, tau=1.0, gamma=0.99, train_freq=4, gradient_steps=1, 
# replay_buffer_class=None, replay_buffer_kwargs=None, optimize_memory_usage=False, target_update_interval=10000, 
# exploration_fraction=0.1, exploration_initial_eps=1.0, exploration_final_eps=0.05, max_grad_norm=10, stats_window_size=100, 
# tensorboard_log=None, policy_kwargs=None, verbose=0, seed=None, device='auto', _init_setup_model=True
learning_rate: 0.0006
batch_size: 64
train_freq: 4
gamma: 0.99


hydra:
  sweeper:
    params:
      REW_ALPHA_COEF: range(0.05,0.201, step=0.005)
      REW_BETA_COEF: range(0.5, 1.01, step=0.05)
      learning_rate: range(0.0003,0.0012, step=0.00003)
      batch_size: choice(32,64,128)
      train_freq: choice(2,4,8,16,64, 128)
      gamma: range(0.01,1, step=0.05) # Default 0.99. Lower value enforce reward values earlier (on first steps)


tuner:
  TRAINING_COVERAGE: 6
  TRAINING_STEPS_PER_EPISODE: 65
  env:
    wrapper:
      env:
        on_terminate: -1 # If >=0 Stop the episode, if STAY action is done without any regret! In such a case reward is increased + on_terminate value
  agent:
    policy:
      learning_rate: ${learning_rate}
      batch_size: ${batch_size}
      train_freq: ${train_freq}
      gamma: ${gamma}

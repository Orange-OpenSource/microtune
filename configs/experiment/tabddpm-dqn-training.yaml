# @package _global_
defaults:
  - _base
  - _sweep_basic
  - override /datasets: traintest-full  # BE CAREFULL to choose it accordingly to the one choosen in dataset_xxx experiment
  - override /tuner: dqn
  - override /tuner/reward: optimal_policy_distance
#  - override /tuner/env/observations: simu
  - _self_

# Workloads selection
datasets_prefix: workloads_simu15 # BE CAREFULL to Use same prefix in corresponding dataset_xxx experimentation....
datasets:
  pickles_prefix: ${datasets_prefix}_tabddpm

info: TABDDPM (simulated) dataset v15, OptimalPolicy Distance reward, fixed hyper-parameters and basic sweep on multiple seeds

# From E11_57_dqn_alphabeta_gammaopti_sweepseed
REW_ALPHA_COEF: 0.185 
REW_BETA_COEF: 0.7

# Use SB3 option in model's Exploration mode 
DETERMINISTIC: True

# Best gamma evaluation is 0.76 (learning_rate=0.00054 batch_size=64 train_freq=128)
learning_rate: 0.00054
batch_size: 64
train_freq: 128
gamma: 0.76

tuner:
  TRAINING_COVERAGE: 6
  agent:
    policy:
      learning_rate: ${learning_rate}
      batch_size: ${batch_size}
      gamma: ${gamma}
      train_freq: ${train_freq}
#      use_sde: ${use_sde}


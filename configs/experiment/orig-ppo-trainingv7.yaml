# @package _global_
defaults:
  - base_simu
  - override /datasets: traintest-simu
  - override /tuner: ppo
  - override /tuner/reward: sigmoidhybriddiscretmoveidelta
  - override /tuner/env/observations: simu
  - _self_

info: Original (live) dataset, and fixed hyper-parameters and basic sweep on multiple seeds + Sigmoid reward + DBSAS OBS 

datasets_prefix: workloads_orig  # Workloads selection

REW_ALPHA_COEF: 0.2
REW_BETA_COEF: 0

# In V7 - New optimal hyper-parameters (with Optuna trained on Datasetv15sall)
learning_rate: 0.0006
batch_size: 256
normalize_advantage: true
n_epochs: 24
gamma: 0.96
use_sde: false

tuner:
  TRAINING_COVERAGE: 14
  agent:
    policy:
      learning_rate: ${learning_rate}
      batch_size: ${batch_size}
      normalize_advantage: ${normalize_advantage}
      n_epochs: ${n_epochs}
      gamma: ${gamma}
      use_sde: ${use_sde}

# @package _global_
defaults:
  - _base
  - _sweep_basic
  - override /datasets: traintest-full
  - override /tuner: ppo
#  - override /tuner/env: continous_actions #discrete_actions (not the default)
  - override /tuner/actions: lessoneplussix
  - override /tuner/reward: optimal_policy_distance # In paper: sigmoidhybriddiscretmoveidelta
  - _self_

info: Use Optimal Hyper params & ALPHA,BETA + rew=optimal_policy_distance FIXED with Arm's factor + Arms (-1,+6) + NOT DETERMINISTIC in Tests

datasets_prefix: workloads_legacy

# Best parameters from 03-opt-ppo-n_arms
REW_ALPHA_COEF: 0.0
REW_BETA_COEF: 0.25

# Use SB3 option in model's Exploration mode 
DETERMINISTIC: False

learning_rate: 0.0003
batch_size: 128
normalize_advantage: True
n_epochs: 3
gamma: 0.98
use_sde: False

tuner:
  TRAINING_COVERAGE: 6
  agent:
    policy:
      learning_rate: ${learning_rate}
      batch_size: ${batch_size}
      normalize_advantage: ${normalize_advantage}
      n_epochs: ${n_epochs}
      gamma: ${gamma}
      use_sde: ${use_sde}

n_jobs: 3
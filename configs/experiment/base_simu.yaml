
# Datasets version with "<version_number>s" name indicating simulation mode. Meaning a version where datasets are may be not directly issued from real observation samples (DataRef) 
version: 15sall # Simu experiments on version 15 datasets with all randtypes and V9+V10+V12.1...V12.19 Datasets
version_minor: 15

pickles_dirname: E${version}_${version_minor}_${hydra:runtime.choices.experiment}

verbosity: 0
xtraverbosity: 0

n_seeds: 1   # Nb seeds per trials
n_jobs: 1 # Number of parallel trainings with different seed of a trial

# Trial Sweeper over random seeds
# RND_SEED is used by models for exploration and so on....
hydra:
  sweeper:
    params:
      RND_SEED: range(4242, 4252, step=1)

# @package _global_
defaults:
  - base_simu
  - override /datasets: traintest-simu
  - override /tuner: a2c
  - override /tuner/reward: sigmoidhybriddiscretmoveidelta
  - override /tuner/env/observations: simu
  - _self_

info: Original (live) dataset, and fixed hyper-parameters and basic sweep on multiple seeds + Sigmoid reward + DBSAS OBS 

datasets_prefix: workloads_orig  # Workloads selection

REW_ALPHA_COEF: 0.2
REW_BETA_COEF: 0

tuner:
  TRAINING_COVERAGE: 14
  agent:
    policy:
      learning_rate: 0.0001
      n_steps: 13
      gamma: 0.91
      gae_lambda: 0.2
#      use_sde: ${use_sde}

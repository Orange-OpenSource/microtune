defaults:
  - base

version: 13Sg # Simu experiments on version 13 datasets with Gaussian randtype  
version_minor: 7

datasets_prefix: workloadssimu_orig  # Workloads selection to be closed to monotonic ones (iperf=0.98 is not crossed twice)

n_seeds: 1   # Nb seeds per trials
n_jobs: 1 # Number of parallel trainings with different seed of a trial

# Trial Sweeper over random seeds
# RND_SEED is used by models for exploration and so on....
hydra:
  sweeper:
    params:
      RND_SEED: range(4242, 4252, step=1)


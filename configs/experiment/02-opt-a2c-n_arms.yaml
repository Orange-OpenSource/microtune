# @package _global_
defaults:
  - _base
  - _sweep_optuna
  - override /datasets: traintest-full
  - override /tuner: a2c
  - override /tuner/actions: lesstenplusten      # The Min and Max action values. Here we have 21 arms: -10 up to -1, 0 and then 1 up to 10
  - override /tuner/reward: optimal_policy_distance # In paper: sigmoidhybriddiscretmoveidelta
  - _self_

info: Hyper params & ALPHA,BETA optim with Optuna + rew=optimal_policy_distance FIXED with Arm's factor + Arms (-10,+10)

datasets_prefix: workloads_legacy

n_seeds: 4
n_jobs: 2 # Number of parallel trainings with different seed
n_trials: 20
hydra_launcher_n_jobs: 2 # Number of trials in parallel with Optuna

# Good evaluation!!
# REW_ALPHA_COEF=0.14
# REW_BETA_COEF=0.6
# learning_rate=0.0016
# n_steps=43
# gamma=0.76
# gae_lambda=0.2

REW_ALPHA_COEF: 0.185 
REW_BETA_COEF: 0.7
REW_ARMS_STRENGTH_OPTION: False # Should be True with the Sigmoid Reward and False with the Optima Distance to the policy reward

learning_rate: 0.0007
n_steps: 5
gamma: 0.99
gae_lambda: 1

hydra:
  sweeper:
    params:
      REW_ALPHA_COEF: range(0.05,0.201, step=0.005)
      REW_BETA_COEF: range(0.5, 1.01, step=0.05)
      learning_rate: range(0.0001,0.01, step=0.0005)
      n_steps: range(3,70, step=5)
      gamma: range(0.01,1, step=0.05) # Lower value enforce reward values earlier (on first steps)
      gae_lambda: range(0.1,1, step=0.1)


tuner:
  TRAINING_COVERAGE: 6
  TRAINING_STEPS_PER_EPISODE: 65
  env:
    wrapper:
      env:
        on_terminate: -1 # If >=0 Stop the episode, if STAY action is done without any regret! In such a case reward is increased + on_terminate value
  agent:
    policy:
      learning_rate: ${learning_rate}
      n_steps:  ${n_steps}
      gamma: ${gamma}
      gae_lambda: ${gae_lambda}
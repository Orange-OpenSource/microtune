# @package _global_
defaults:
  - _base
  - _sweep_basic
#  - override /datasets: traintest-simu
  - override /tuner: dqn
  - override /tuner/reward: optimal_policy_distance
#  - override /tuner/env/observations: simu
  - _self_

info: Original (live) dataset v15, OptimalPolicy Distance reward, fixed hyper-parameters and basic sweep on multiple seeds

# Workloads selection
datasets:
  pickles_prefix: ${datasets_prefix}_orig

# Adapted reward coefficients for Optimal Policy Distance reward ?
REW_ALPHA_COEF: 0.09 
REW_BETA_COEF: 0.6
REW_ARMS_STRENGTH_OPTION: False # Do not emphasize arm's strength in the reward computation

# Best gamma evaluation is 0.76 (learning_rate=0.00054 batch_size=64 train_freq=128)
learning_rate: 0.00054
batch_size: 64
train_freq: 128
gamma: 0.76

tuner:
  TRAINING_COVERAGE: 6
  TRAINING_STEPS_PER_EPISODE: 65
  agent:
    policy:
      learning_rate: ${learning_rate}
      batch_size: ${batch_size}
      gamma: ${gamma}
      train_freq: ${train_freq}
#      use_sde: ${use_sde}

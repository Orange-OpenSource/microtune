# @package _global_
defaults:
  - _base
  - _sweep_basic
  - override /datasets: traintest-full     # BE CAREFULL to choose it accordingly to the one choosen in dataset_xxx experiment
  - override /tuner: ppo
  - override /tuner/reward: sigmoidhybriddiscretmoveidelta
  - _self_

# TODO: 
#   - See 04-opt-ppo-n_arms to see how to switch into Discrete ActionSpace.
#   - Apply setting in every PPO experiments or set it as default in code base

datasets_prefix: workloads_legacy # BE CAREFULL to Use same prefix in corresponding dataset_xxx experimentation....

info: PPO 11 Revival with fixed hyper-parameters and basic sweep on multiple seeds + Sigmoid reward +  Optimized OBS (Dav.) + cleaned WL (c98, Yif.)

n_seeds: 1   # Nb seeds per trials
n_jobs: 1 # Number of parallel trainings with different seed of a trial
hydra_launcher_n_jobs: 1 # Number of trials in parallel with Optuna

REW_ALPHA_COEF: 0.2
REW_BETA_COEF: 0

learning_rate: 0.0005
batch_size: 128
normalize_advantage: True
n_epochs: 3
gamma: 0.81

hydra:
  sweeper:
    params:
      RND_SEED: range(4242, 4252, step=1)
tuner:
  TRAINING_COVERAGE: 9
  TRAINING_STEPS_PER_EPISODE: 68
  agent:
    policy:
      learning_rate: ${learning_rate}
      batch_size: ${batch_size}
      normalize_advantage: ${normalize_advantage}
      n_epochs: ${n_epochs}
      gamma: ${gamma}
#      use_sde: ${use_sde}

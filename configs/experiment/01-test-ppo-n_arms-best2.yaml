# @package _global_
defaults:
  - _base
  - _sweep_basic
  - override /datasets: traintest-full
  - override /tuner: ppo
  - override /tuner/env: continous_actions #discrete_actions
  - override /tuner/actions: lesstenplusten      # The Min and Max action values. Here we have 21 arms: -10 up to -1, 0 and then 1 up to 10
  - override /tuner/reward: optimal_policy_distance # In paper: sigmoidhybriddiscretmoveidelta
  - _self_

info: Based on SB3PPOT2S3 in 01-opt-ppo-n_arms 16_21sall + Arms (-10,+10) + force DETERMINISTIC option for Predictions to True

datasets_prefix: workloads_legacy

#n_seeds: 4
n_jobs: 2 # Number of parallel trainings with different seed
#n_trials: 10
#hydra_launcher_n_jobs: 1 # Number of trials in parallel with Optuna

# Based on SB3PPOT7S1 in 01-opt-ppo-n_arms 16_21sall
REW_ALPHA_COEF: 0.245 
REW_BETA_COEF: 0.5
REW_ARMS_STRENGTH_OPTION: False # Should be True with the Sigmoid Reward and False with the Optima Distance to the policy reward

# What we want to test!!
DETERMINISTIC: True

# learning_rate=0.0003, n_steps=2048, batch_size=64, n_epochs=10, gamma=0.99, gae_lambda=0.95, clip_range=0.2, clip_range_vf=None, normalize_advantage=True, 
# ent_coef=0.0, vf_coef=0.5, max_grad_norm=0.5, use_sde=False, sde_sample_freq=-1, rollout_buffer_class=None, rollout_buffer_kwargs=None, 
# target_kl=None, stats_window_size=100, 
# tensorboard_log=None, policy_kwargs=None, verbose=0, seed=None, device='auto', _init_setup_model=True
learning_rate: 0.0003
batch_size: 64
normalize_advantage: True
n_epochs: 24
gamma: 0.98
use_sde: True  # Works only with continous action space

tuner:
  TRAINING_COVERAGE: 6
  TRAINING_STEPS_PER_EPISODE: 65
  env:
    wrapper:
      env:
        on_terminate: -1 # If >=0 Stop the episode, if STAY action is done without any regret! In such a case reward is increased + on_terminate value
  agent:
    policy:
      learning_rate: ${learning_rate}
      batch_size: ${batch_size}
      normalize_advantage: ${normalize_advantage}
      n_epochs: ${n_epochs}
      gamma: ${gamma}
      use_sde: ${use_sde}

# @package _global_
defaults:
  - _base
  - _sweep_basic
  - override /datasets: traintest-full  # BE CAREFULL to choose it accordingly to the one choosen in dataset_xxx experiment
  - override /tuner: ppo
  - override /tuner/reward: optimal_policy_distance
#  - override /tuner/env/observations: simu
  - _self_

datasets_prefix: workloads_simu15 # BE CAREFULL to Use same prefix in corresponding dataset_xxx experimentation....

info: Original (live) dataset v15, OptimalPolicy Distance reward, fixed hyper-parameters and basic sweep on multiple seeds

# Adapted reward coefficients for Optimal Policy Distance reward ?
REW_ALPHA_COEF: 0.185 
REW_BETA_COEF: 0.7

# Use SB3 option in model's Exploration mode 
DETERMINISTIC: True

learning_rate: 0.0004
batch_size: 128
normalize_advantage: false
n_epochs: 3
gamma: 0.94
use_sde: false

tuner:
  TRAINING_COVERAGE: 6
  agent:
    policy:
      learning_rate: ${learning_rate}
      batch_size: ${batch_size}
      normalize_advantage: ${normalize_advantage}
      n_epochs: ${n_epochs}
      gamma: ${gamma}
      use_sde: ${use_sde}


# @package _global_
defaults:
  - _base
  - _sweep_basic
  - override /datasets: traintest-full  # BE CAREFULL to choose it accordingly to the one choosen in dataset_xxx experiment
  - override /tuner: a2c
  - override /tuner/reward: optimal_policy_distance
#  - override /tuner/env/observations: simu
  - _self_

# Workloads selection
datasets_prefix: workloads_simu15 # BE CAREFULL to Use same prefix in corresponding dataset_xxx experimentation....
datasets:
  pickles_prefix: ${datasets_prefix}_cvae

info: CVAE (simulated) dataset v15, OptimalPolicy Distance reward, fixed hyper-parameters and basic sweep on multiple seeds 

# Adapted reward coefficients for Optimal Policy Distance reward ?
REW_ALPHA_COEF: 0.185 
REW_BETA_COEF: 0.7

# Use SB3 option in model's Exploration mode 
DETERMINISTIC: True

tuner:
  TRAINING_COVERAGE: 6
  agent:
    policy:
      learning_rate: 0.0001
      n_steps: 13
      gamma: 0.91
      gae_lambda: 0.2
#      use_sde: ${use_sde}


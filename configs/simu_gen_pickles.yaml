# Get conf by running --cfg job --resolve

# python run_simu_xxx.py --cfg job 

defaults:
  - base  # ouput paths, verbosity, ...
  - datasets@orig: traintest-simu
  - datasets@dbsas: traintest-simu
  - datasets@cvae: traintest-simu
  - _self_

version: 13Sg # In simulation mode, Gaussian randtype only
datasets_prefix: workloadssimu  # Workloads selection

# Input datasets files with .pickles extension, for the original and a simulated datasets like DBSAS, CVAE, ... 
dataset_orig_import_file: original_dataset_gaussian12  # Original, NOT simulated data, with Gaussian randtype only
dataset_dbsas_import_file: simu_db_fullnetwork_generated_full_dataset_discrete  # DBSAS generated dataset 
dataset_cvae_import_file: simu_CVAE_generated_full_dataset  # CVAE generated dataset

# Output pickles files prefixes for original and dbsas datasets
orig:
  pickles_prefix: ${datasets_prefix}_orig

dbsas:
  pickles_prefix: ${datasets_prefix}_dbsas

cvae:
  pickles_prefix: ${datasets_prefix}_cvae

defaults:
  - env: continous_actions
  - base_nn
  - _self_

agent:
  policy:
    _target_: pkg.policy_sb3.SB3PolicyDDPG
    policy: "MlpPolicy"
    action_noise:
      _target_: pkg.actions.NormalActionNoise
      noise_sigma: 0.1
    learning_rate: 0.001
    seed: ${RND_SEED}
    verbose: ${verbosity}


